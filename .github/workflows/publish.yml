name: publish

# 手动触发，或推一个 v* 标签（例如 git tag v0.1.2 && git push --tags）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Tests
        run: npm test

      - name: Docs check
        run: node tools/check-docs.mjs

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const version = require("./package.json").version
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (version !== tag) {
              console.error(`tag v${tag} 与 package.json 的 ${version} 不一致，先对齐再发`)
              process.exit(1)
            }
          '

      - name: Refuse to republish an existing version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-wallport@$version" version >/dev/null 2>&1; then
            echo "dsh-wallport@$version 已经发布过了：改 package.json 的 version 再发" >&2
            exit 1
          fi

      # 需要仓库 secret NPM_TOKEN：npm 网站 → Access Tokens → Generate New Token →
      # Granular Access Token，勾选 "Bypass 2FA"，权限选 Read and write；
      # 然后 GitHub 仓库 → Settings → Secrets and variables → Actions → New secret。
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
